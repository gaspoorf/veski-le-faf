<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>VESKI LE FACHO</title>
    <link rel="stylesheet" href="/src/style.css" />

    <link rel="icon" type="image/png" href="./img/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./img/favicon/favicon.svg" />
    <link rel="shortcut icon" href="./img/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./img/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Veski Le Facho" />
    <link rel="manifest" href="./img/favicon/site.webmanifest" />


  </head>
  <body>

    <div class="loader">
      <div class="text">0%</div>
      <button class="button enter-button">ENTRER</button>
    </div>

    <div id="menu">
      <img src="/img/logo-facho.webp" alt="logo" />
    </div>
    <div class="button-container-start">
      <button class="button" id="start-button">LANCER</button>
    </div>


    <div class="game-over-container">

      <div id="game-over">
        <img src="/img/lost-dark.svg" alt="game over" />
      </div>

      <div class="score-container">

        <div class="lines-score">
          <p>FACHOS VESKI</p>
          <div id="score">
            <span>0</span>
            <img class="icon-score" src="/img/faf.webp" alt="score"/>
          </div>
        </div>

        <div class="lines-coins">
          <p>ANTIFACOINS</p>
          <div id="coins">
            <span>0</span>
            <img class="icon-coin" src="/img/coin.webp" alt="coin"/>
          </div>
        </div>

      </div>

      <div class="button-container-go">
        <button id="restart-button" class="button">RELANCER</button>
        <button id="menu-button" class="button">MENU</button>
      </div>

    </div>

    <script type="module" src="/src/game/Experience.js"></script>
  </body>
</html>
