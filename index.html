<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>VESKI LE FAF</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>

    <div class="loader">
      <div class="text">0%</div>
      <button class="button enter-button">ENTRER</button>
    </div>

    <div id="menu">
      <img src="/img/logo-faf.webp" alt="logo" />
    </div>
    <div class="button-container-start">
      <button class="button" id="start-button">C'EST PARTI</button>
    </div>


    <div class="game-over-container">

      <div id="game-over">
        <img src="/img/lost.svg" alt="game over" />
      </div>

      <div class="score-container">

        <div class="lines-score">
          <p>FAFS VESKI</p>
          <div id="score">
            <span>0</span>
            <img class="icon-score" src="/img/faf.webp" alt="score"/>
          </div>
        </div>

        <div class="lines-coins">
          <p>ANTIFACOINS</p>
          <div id="coins">
            <span>0</span>
            <img class="icon-coin" src="/img/coin.webp" alt="coin"/>
          </div>
        </div>

      </div>

      <div class="button-container-go">
        <button id="restart-button" class="button">RELANCER</button>
        <button id="menu-button" class="button">MENU</button>
      </div>

    </div>

    <script type="module" src="/src/game/Experience.js"></script>
  </body>
</html>
